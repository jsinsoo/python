 변경과 실행 순서를 함께 살펴보세요."], "english": "a = {1, 2, 3}\nb = {2, 3, 4}\nprint(sorted(a & b))"}, {"step": 8, "number": 8, "title": "차집합", "code": "출력 = print\n정렬 = sorted\n가 = {1, 2, 3}\n나 = {2, 3}\n출력(정렬(가 - 나))", "desc": ["핵심 원리: 차집합은 왼쪽 집합에는 있고 오른쪽 집합에는 없는 원소입니다.", "코드 적용: 피연산자의 순서를 바꾸면 결과가 달라질 수 있습니다.", "`가 = {1, 2, 3}` — 오른쪽 식을 계산해 왼쪽 대상에 저장하거나 갱신합니다.", "`나 = {2, 3}` — 오른쪽 식을 계산해 왼쪽 대상에 저장하거나 갱신합니다.", "`출력(정렬(가 - 나))` — 현재 변수값과 식을 평가한 결과가 실행에 반영됩니다.", "확인 활동: 코드의 자료값 한 개를 바꾸어 해당 연산 또는 분기의 결과를 비교하세요.", "주의할 점: 결과를 예측할 때 출력문뿐 아니라 변수의 변경과 실행 순서를 함께 살펴보세요."], "english": "a = {1, 2, 3}\nb = {2, 3}\nprint(sorted(a - b))"}, {"step": 8, "number": 9, "title": "항목 순회", "code": "출력 = print\n학생 = {\"국어\": 80, \"수학\": 95}\nfor 과목, 점수 in 학생.items():\n    출력(과목, 점수)", "desc": ["핵심 원리: items는 딕셔너리의 키와 값을 쌍으로 순회하게 합니다.", "코드 적용: 반복마다 키와 값을 분리해 활용합니다.", "`학생 = {\"국어\": 80, \"수학\": 95}` — 오른쪽 식을 계산해 왼쪽 대상에 저장하거나 갱신합니다.", "`for 과목, 점수 in 학생.items():` — 반복 조건과 순회 순서를 결정하는 문장입니다.", "`출력(과목, 점수)` — 현재 변수값과 식을 평가한 결과가 실행에 반영됩니다.", "확인 활동: 코드의 자료값 한 개를 바꾸어 해당 연산 또는 분기의 결과를 비교하세요.", "주의할 점: 결과를 예측할 때 출력문뿐 아니라 변수의 변경과 실행 순서를 함께 살펴보세요."], "english": "student = {\"국어\": 80, \"수학\": 95}\nfor subject, score in student.items():\n    print(subject, score)"}, {"step": 8, "number": 10, "title": "문자 빈도", "code": "출력 = print\n문장 = \"banana\"\n빈도 = {}\nfor 글자 in 문장:\n    빈도[글자] = 빈도.get(글자, 0) + 1\n출력(빈도)", "desc": ["핵심 원리: 문자를 하나씩 세어 딕셔너리에 빈도수를 누적합니다.", "코드 적용: 같은 문자가 다시 나오면 해당 키의 개수가 증가합니다.", "`문장 = \"banana\"` — 오른쪽 식을 계산해 왼쪽 대상에 저장하거나 갱신합니다.", "`빈도 = {}` — 오른쪽 식을 계산해 왼쪽 대상에 저장하거나 갱신합니다.", "`for 글자 in 문장:` — 반복 조건과 순회 순서를 결정하는 문장입니다.", "`빈도[글자] = 빈도.get(글자, 0) + 1` — 오른쪽 식을 계산해 왼쪽 대상에 저장하거나 갱신합니다.", "확인 활동: 코드의 자료값 한 개를 바꾸어 해당 연산 또는 분기의 결과를 비교하세요.", "주의할 점: 결과를 예측할 때 출력문뿐 아니라 변수의 변경과 실행 순서를 함께 살펴보세요."], "english": "sentence = \"banana\"\nfrequency = {}\nfor character in sentence:\n    frequency[character] = frequency.get(character, 0) + 1\nprint(frequency)"}, {"step": 9, "number": 1, "title": "함수 호출", "code": "출력 = print\ndef 인사():\n    출력(\"안녕하세요\")\n인사()", "desc": ["핵심 원리: def는 함수를 정의할 뿐이며 호출해야 본문이 실행됩니다.", "코드 적용: 호출 시 전달한 인수가 매개변수에 연결됩니다.", "`def 인사():` — 함수 이름과 매개변수를 선언하는 부분입니다.", "`출력(\"안녕하세요\")` — 현재 변수값과 식을 평가한 결과가 실행에 반영됩니다.", "`인사()` — 현재 변수값과 식을 평가한 결과가 실행에 반영됩니다.", "확인 활동: 코드의 자료값 한 개를 바꾸어 해당 연산 또는 분기의 결과를 비교하세요.", "주의할 점: 결과를 예측할 때 출력문뿐 아니라 변수의 변경과 실행 순서를 함께 살펴보세요."], "english": "def greet():\n    print(\"안녕하세요\")\ngreet()"}, {"step": 9, "number": 2, "title": "제곱 함수", "code": "출력 = print\ndef 제곱(수):\n    return 수 * 수\n출력(제곱(4))", "desc": ["핵심 원리: 함수는 입력값을 제곱한 결과를 return으로 돌려줍니다.", "코드 적용: return 값과 print로 화면에 표시하는 동작은 다릅니다.", "`def 제곱(수):` — 함수 이름과 매개변수를 선언하는 부분입니다.", "`return 수 * 수` — 호출한 곳에 계산 결과를 반환하며 함수를 종료합니다.", "`출력(제곱(4))` — 현재 변수값과 식을 평가한 결과가 실행에 반영됩니다.", "확인 활동: 코드의 자료값 한 개를 바꾸어 해당 연산 또는 분기의 결과를 비교하세요.", "주의할 점: 결과를 예측할 때 출력문뿐 아니라 변수의 변경과 실행 순서를 함께 살펴보세요."], "english": "def square(number):\n    return number * number\nprint(square(4))"}, {"step": 9, "number": 3, "title": "두 수의 합", "code": "출력 = print\ndef 합계(가, 나):\n    return 가 + 나\n출력(합계(3, 5))", "desc": ["핵심 원리: 두 매개변수를 받아 합을 계산하는 함수를 정의합니다.", "코드 적용: 호출할 때 전달한 두 인수가 계산에 사용됩니다.", "`def 합계(가, 나):` — 함수 이름과 매개변수를 선언하는 부분입니다.", "`return 가 + 나` — 호출한 곳에 계산 결과를 반환하며 함수를 종료합니다.", "`출력(합계(3, 5))` — 현재 변수값과 식을 평가한 결과가 실행에 반영됩니다.", "확인 활동: 코드의 자료값 한 개를 바꾸어 해당 연산 또는 분기의 결과를 비교하세요.", "주의할 점: 결과를 예측할 때 출력문뿐 아니라 변수의 변경과 실행 순서를 함께 살펴보세요."], "english": "def total(a, b):\n    return a + b\nprint(total(3, 5))"}, {"step": 9, "number": 4, "title": "기본 매개변수", "code": "출력 = print\ndef 인사(이름=\"학생\"):\n    출력(\"반가워요\", 이름)\n인사()", "desc": ["핵심 원리: 기본값이 지정된 매개변수는 인수를 생략했을 때 그 값을 사용합니다.", "코드 적용: 인수를 제공한 호출과 생략한 호출을 비교합니다.", "`def 인사(이름=\"학생\"):` — 함수 이름과 매개변수를 선언하는 부분입니다.", "`출력(\"반가워요\", 이름)` — 현재 변수값과 식을 평가한 결과가 실행에 반영됩니다.", "`인사()` — 현재 변수값과 식을 평가한 결과가 실행에 반영됩니다.", "확인 활동: 코드의 자료값 한 개를 바꾸어 해당 연산 또는 분기의 결과를 비교하세요.", "주의할 점: 결과를 예측할 때 출력문뿐 아니라 변수의 변경과 실행 순서를 함께 살펴보세요."], "english": "def greet(name=\"학생\"):\n    print(\"반가워요\", name)\ngreet()"}, {"step": 9, "number": 5, "title": "불 반환", "code": "출력 = print\ndef 짝수인가(수):\n    return 수 % 2 == 0\n출력(짝수인가(8))", "desc": ["핵심 원리: 비교 결과를 return하면 함수의 반환형이 bool이 됩니다.", "코드 적용: 호출 결과가 True인지 False인지 조건으로 추적합니다.", "`def 짝수인가(수):` — 함수 이름과 매개변수를 선언하는 부분입니다.", "`return 수 % 2 == 0` — 호출한 곳에 계산 결과를 반환하며 함수를 종료합니다.", "`출력(짝수인가(8))` — 현재 변수값과 식을 평가한 결과가 실행에 반영됩니다.", "확인 활동: 코드의 자료값 한 개를 바꾸어 해당 연산 또는 분기의 결과를 비교하세요.", "주의할 점: 결과를 예측할 때 출력문뿐 아니라 변수의 변경과 실행 순서를 함께 살펴보세요."], "english": "def is_even(number):\n    return number % 2 == 0\nprint(is_even(8))"}, {"step": 9, "number": 6, "title": "재귀 팩토리얼", "code": "출력 = print\ndef 계승(수):\n    if 수 <= 1:\n        return 1\n    return 수 * 계승(수 - 1)\n출력(계승(5))", "desc": ["핵심 원리: 팩토리얼은 n과 (n-1)의 팩토리얼을 곱하는 재귀 구조입니다.", "코드 적용: n이 작은 기본 조건에서 호출이 멈춘 뒤 결과가 역순으로 계산됩니다.", "`def 계승(수):` — 함수 이름과 매개변수를 선언하는 부분입니다.", "`if 수 <= 1:` — 조건식 평가 결과에 따라 이 분기의 실행 여부가 결정됩니다.", "`return 1` — 호출한 곳에 계산 결과를 반환하며 함수를 종료합니다.", "`return 수 * 계승(수 - 1)` — 호출한 곳에 계산 결과를 반환하며 함수를 종료합니다.", "확인 활동: 코드의 자료값 한 개를 바꾸어 해당 연산 또는 분기의 결과를 비교하세요.", "주의할 점: 결과를 예측할 때 출력문뿐 아니라 변수의 변경과 실행 순서를 함께 살펴보세요."], "english": "def factorial(number):\n    if number <= 1:\n        return 1\n    return number * factorial(number - 1)\nprint(factorial(5))"}, {"step": 9, "number": 7, "title": "재귀 피보나치", "code": "출력 = print\ndef 피보나치(수):\n    if 수 < 2:\n        return 수\n    return 피보나치(수-1) + 피보나치(수-2)\n출력(피보나치(6))", "desc": ["핵심 원리: 피보나치는 앞의 두 항을 더해 다음 항을 구합니다.", "코드 적용: 재귀 호출이 중복될 수 있어 큰 입력에서는 효율성이 떨어집니다.", "`def 피보나치(수):` — 함수 이름과 매개변수를 선언하는 부분입니다.", "`if 수 < 2:` — 조건식 평가 결과에 따라 이 분기의 실행 여부가 결정됩니다.", "`return 수` — 호출한 곳에 계산 결과를 반환하며 함수를 종료합니다.", "`return 피보나치(수-1) + 피보나치(수-2)` — 호출한 곳에 계산 결과를 반환하며 함수를 종료합니다.", "확인 활동: 코드의 자료값 한 개를 바꾸어 해당 연산 또는 분기의 결과를 비교하세요.", "주의할 점: 결과를 예측할 때 출력문뿐 아니라 변수의 변경과 실행 순서를 함께 살펴보세요."], "english": "def fibonacci(number):\n    if number < 2:\n        return number\n    return fibonacci(number-1) + fibonacci(number-2)\nprint(fibonacci(6))"}, {"step": 9, "number": 8, "title": "평균 함수", "code": "출력 = print\n길이 = len\n합 = sum\ndef 평균(자료):\n    return 합(자료) / 길이(자료)\n출력(평균([70, 80, 90]))", "desc": ["핵심 원리: 평균은 합계를 원소 개수로 나누어 구합니다.", "코드 적용: 빈 리스트에서는 0으로 나누는 상황을 별도로 처리해야 합니다.", "`def 평균(자료):` — 함수 이름과 매개변수를 선언하는 부분입니다.", "`return 합(자료) / 길이(자료)` — 호출한 곳에 계산 결과를 반환하며 함수를 종료합니다.", "`출력(평균([70, 80, 90]))` — 현재 변수값과 식을 평가한 결과가 실행에 반영됩니다.", "확인 활동: 코드의 자료값 한 개를 바꾸어 해당 연산 또는 분기의 결과를 비교하세요.", "주의할 점: 결과를 예측할 때 출력문뿐 아니라 변수의 변경과 실행 순서를 함께 살펴보세요."], "english": "def average(data):\n    return sum(data) / len(data)\nprint(average([70, 80, 90]))"}, {"step": 9, "number": 9, "title": "최댓값 함수", "code": "출력 = print\n최댓값 = max\ndef 최대값(자료):\n    return 최댓값(자료)\n출력(최대값([2, 9, 5]))", "desc": ["핵심 원리: 최댓값은 여러 원소 중 가장 큰 값을 선택합니다.", "코드 적용: 음수만 있는 자료도 올바르게 처리하는지 살펴봅니다.", "`def 최대값(자료):` — 함수 이름과 매개변수를 선언하는 부분입니다.", "`return 최댓값(자료)` — 호출한 곳에 계산 결과를 반환하며 함수를 종료합니다.", "`출력(최대값([2, 9, 5]))` — 현재 변수값과 식을 평가한 결과가 실행에 반영됩니다.", "확인 활동: 코드의 자료값 한 개를 바꾸어 해당 연산 또는 분기의 결과를 비교하세요.", "주의할 점: 결과를 예측할 때 출력문뿐 아니라 변수의 변경과 실행 순서를 함께 살펴보세요."], "english": "def maximum(data):\n    return max(data)\nprint(maximum([2, 9, 5]))"}, {"step": 9, "number": 10, "title": "재귀 카운트다운", "code": "출력 = print\ndef 카운트다운(수):\n    if 수 == 0:\n        return\n    출력(수)\n    카운트다운(수 - 1)\n카운트다운(3)", "desc": ["핵심 원리: 현재 수를 출력하고 더 작은 수로 자신을 다시 호출합니다.", "코드 적용: 기본 조건이 없으면 호출이 끝나지 않습니다.", "`def 카운트다운(수):` — 함수 이름과 매개변수를 선언하는 부분입니다.", "`if 수 == 0:` — 조건식 평가 결과에 따라 이 분기의 실행 여부가 결정됩니다.", "`return` — 현재 변수값과 식을 평가한 결과가 실행에 반영됩니다.", "`출력(수)` — 현재 변수값과 식을 평가한 결과가 실행에 반영됩니다.", "확인 활동: 코드의 자료값 한 개를 바꾸어 해당 연산 또는 분기의 결과를 비교하세요.", "주의할 점: 결과를 예측할 때 출력문뿐 아니라 변수의 변경과 실행 순서를 함께 살펴보세요."], "english": "def countdown(number):\n    if number == 0:\n        return\n    print(number)\n    countdown(number - 1)\ncountdown(3)"}, {"step": 10, "number": 1, "title": "정상 변환", "code": "출력 = print\n정수 = int\ntry:\n    출력(정수(\"12\"))\nexcept ValueError:\n    출력(\"변환 실패\")", "desc": ["핵심 원리: 올바른 숫자 문자열은 int로 정수 변환할 수 있습니다.", "코드 적용: 변환 성공 시 다음 문장으로 실행이 이어집니다.", "`try:` — 정상 처리와 오류 발생 시 실행 경로를 나눕니다.", "`출력(정수(\"12\"))` — 현재 변수값과 식을 평가한 결과가 실행에 반영됩니다.", "`except ValueError:` — 정상 처리와 오류 발생 시 실행 경로를 나눕니다.", "`출력(\"변환 실패\")` — 현재 변수값과 식을 평가한 결과가 실행에 반영됩니다.", "확인 활동: 코드의 자료값 한 개를 바꾸어 해당 연산 또는 분기의 결과를 비교하세요.", "주의할 점: 결과를 예측할 때 출력문뿐 아니라 변수의 변경과 실행 순서를 함께 살펴보세요."], "english": "try:\n    print(int(\"12\"))\nexcept ValueError:\n    print(\"변환 실패\")"}, {"step": 10, "number": 2, "title": "변환 예외", "code": "출력 = print\n정수 = int\ntry:\n    출력(정수(\"가\"))\nexcept ValueError:\n    출력(\"숫자 아님\")", "desc": ["핵심 원리: 숫자가 아닌 문자열을 int로 변환하면 ValueError가 발생합니다.", "코드 적용: try와 except는 이 오류를 처리해 프로그램 중단을 막습니다.", "`try:` — 정상 처리와 오류 발생 시 실행 경로를 나눕니다.", "`출력(정수(\"가\"))` — 현재 변수값과 식을 평가한 결과가 실행에 반영됩니다.", "`except ValueError:` — 정상 처리와 오류 발생 시 실행 경로를 나눕니다.", "`출력(\"숫자 아님\")` — 현재 변수값과 식을 평가한 결과가 실행에 반영됩니다.", "확인 활동: 코드의 자료값 한 개를 바꾸어 해당 연산 또는 분기의 결과를 비교하세요.", "주의할 점: 결과를 예측할 때 출력문뿐 아니라 변수의 변경과 실행 순서를 함께 살펴보세요."], "english": "try:\n    print(int(\"가\"))\nexcept ValueError:\n    print(\"숫자 아님\")"}, {"step": 10, "number": 3, "title": "파일 쓰기", "code": "출력 = print\nwith open(\"연습.txt\", \"w\", encoding=\"utf-8\") as 파일:\n    파일.write(\"안녕하세요\")\n출력(\"저장 완료\")", "desc": ["핵심 원리: 쓰기 모드 w는 파일을 새로 만들거나 기존 내용을 덮어씁니다.", "코드 적용: with 블록이 끝나면 파일이 자동으로 닫힙니다.", "`with open(\"연습.txt\", \"w\", encoding=\"utf-8\") as 파일:` — 파일 자원을 열고 블록 종료 시 안전하게 정리합니다.", "`파일.write(\"안녕하세요\")` — 현재 변수값과 식을 평가한 결과가 실행에 반영됩니다.", "`출력(\"저장 완료\")` — 현재 변수값과 식을 평가한 결과가 실행에 반영됩니다.", "확인 활동: 코드의 자료값 한 개를 바꾸어 해당 연산 또는 분기의 결과를 비교하세요.", "주의할 점: 결과를 예측할 때 출력문뿐 아니라 변수의 변경과 실행 순서를 함께 살펴보세요."], "english": "with open(\"연습.txt\", \"w\", encoding=\"utf-8\") as file:\n    file.write(\"안녕하세요\")\nprint(\"저장 완료\")"}, {"step": 10, "number": 4, "title": "파일 읽기", "code": "출력 = print\nwith open(\"연습.txt\", \"w\", encoding=\"utf-8\") as 파일:\n    파일.write(\"한글 코드\")\nwith open(\"연습.txt\", encoding=\"utf-8\") as 파일:\n    출력(파일.read())", "desc": ["핵심 원리: 읽기 모드 r은 기존 파일의 내용을 가져옵니다.", "코드 적용: 파일이 없으면 FileNotFoundError가 발생할 수 있습니다.", "`with open(\"연습.txt\", \"w\", encoding=\"utf-8\") as 파일:` — 파일 자원을 열고 블록 종료 시 안전하게 정리합니다.", "`파일.write(\"한글 코드\")` — 현재 변수값과 식을 평가한 결과가 실행에 반영됩니다.", "`with open(\"연습.txt\", encoding=\"utf-8\") as 파일:` — 파일 자원을 열고 블록 종료 시 안전하게 정리합니다.", "`출력(파일.read())` — 현재 변수값과 식을 평가한 결과가 실행에 반영됩니다.", "확인 활동: 코드의 자료값 한 개를 바꾸어 해당 연산 또는 분기의 결과를 비교하세요.", "주의할 점: 결과를 예측할 때 출력문뿐 아니라 변수의 변경과 실행 순서를 함께 살펴보세요."], "english": "with open(\"연습.txt\", \"w\", encoding=\"utf-8\") as file:\n    file.write(\"한글 코드\")\nwith open(\"연습.txt\", encoding=\"utf-8\") as file:\n    print(file.read())"}, {"step": 10, "number": 5, "title": "평균 프로젝트", "code": "출력 = print\n길이 = len\n합 = sum\n자료 = [80, 90, 100]\n출력(\"평균\", 합(자료) / 길이(자료))", "desc": ["핵심 원리: 점수 자료의 총합을 원소 개수로 나누어 평균을 구합니다.", "코드 적용: 계산 과정과 표시 형식을 구별해 살펴봅니다.", "`자료 = [80, 90, 100]` — 오른쪽 식을 계산해 왼쪽 대상에 저장하거나 갱신합니다.", "`출력(\"평균\", 합(자료) / 길이(자료))` — 현재 변수값과 식을 평가한 결과가 실행에 반영됩니다.", "확인 활동: 코드의 자료값 한 개를 바꾸어 해당 연산 또는 분기의 결과를 비교하세요.", "주의할 점: 결과를 예측할 때 출력문뿐 아니라 변수의 변경과 실행 순서를 함께 살펴보세요."], "english": "data = [80, 90, 100]\nprint(\"평균\", sum(data) / len(data))"}, {"step": 10, "number": 6, "title": "입력 검증", "code": "출력 = print\ndef 점수검사(점수):\n    if not 0 <= 점수 <= 100:\n        return \"오류\"\n    return \"정상\"\n출력(점수검사(101))", "desc": ["핵심 원리: 입력값이 허용 범위에 속하는지 확인해 잘못된 자료를 걸러냅니다.", "코드 적용: 정상값과 경계값, 잘못된 값을 각각 시험해 봅니다.", "`def 점수검사(점수):` — 함수 이름과 매개변수를 선언하는 부분입니다.", "`if not 0 <= 점수 <= 100:` — 조건식 평가 결과에 따라 이 분기의 실행 여부가 결정됩니다.", "`return \"오류\"` — 호출한 곳에 계산 결과를 반환하며 함수를 종료합니다.", "`return \"정상\"` — 호출한 곳에 계산 결과를 반환하며 함수를 종료합니다.", "확인 활동: 코드의 자료값 한 개를 바꾸어 해당 연산 또는 분기의 결과를 비교하세요.", "주의할 점: 결과를 예측할 때 출력문뿐 아니라 변수의 변경과 실행 순서를 함께 살펴보세요."], "english": "def check_score(score):\n    if not 0 <= score <= 100:\n        return \"오류\"\n    return \"정상\"\nprint(check_score(101))"}, {"step": 10, "number": 7, "title": "경로 확인", "code": "출력 = print\nfrom pathlib import Path\n경로 = Path(\"연습.txt\")\n출력(경로.suffix)", "desc": ["핵심 원리: 파일 경로의 존재 여부를 검사하여 후속 작업 가능성을 판단합니다.", "코드 적용: 상대 경로는 현재 작업 폴더에 따라 의미가 달라집니다.", "`from pathlib import Path` — 현재 변수값과 식을 평가한 결과가 실행에 반영됩니다.", "`경로 = Path(\"연습.txt\")` — 오른쪽 식을 계산해 왼쪽 대상에 저장하거나 갱신합니다.", "`출력(경로.suffix)` — 현재 변수값과 식을 평가한 결과가 실행에 반영됩니다.", "확인 활동: 코드의 자료값 한 개를 바꾸어 해당 연산 또는 분기의 결과를 비교하세요.", "주의할 점: 결과를 예측할 때 출력문뿐 아니라 변수의 변경과 실행 순서를 함께 살펴보세요."], "english": "from pathlib import Path\npath = Path(\"연습.txt\")\nprint(path.suffix)"}, {"step": 10, "number": 8, "title": "정렬 프로젝트", "code": "출력 = print\n정렬 = sorted\n자료 = [3, 1, 4, 2]\n출력(\"정렬\", 정렬(자료))", "desc": ["핵심 원리: 여러 값을 정렬하여 크기순으로 나열합니다.", "코드 적용: 원본을 바꾸는 sort와 새 리스트를 만드는 sorted의 차이를 확인합니다.", "`자료 = [3, 1, 4, 2]` — 오른쪽 식을 계산해 왼쪽 대상에 저장하거나 갱신합니다.", "`출력(\"정렬\", 정렬(자료))` — 현재 변수값과 식을 평가한 결과가 실행에 반영됩니다.", "확인 활동: 코드의 자료값 한 개를 바꾸어 해당 연산 또는 분기의 결과를 비교하세요.", "주의할 점: 결과를 예측할 때 출력문뿐 아니라 변수의 변경과 실행 순서를 함께 살펴보세요."], "english": "data = [3, 1, 4, 2]\nprint(\"정렬\", sorted(data))"}, {"step": 10, "number": 9, "title": "전력 계산", "code": "출력 = print\ndef 전력량(시간, 와트):\n    return 시간 * 와트 / 1000\n출력(전력량(5, 200))", "desc": ["핵심 원리: 소비 전력량(kWh)은 전력(W)에 시간(h)을 곱한 뒤 1000으로 나눕니다.", "코드 적용: 200W 기기를 5시간 사용하면 1.0kWh입니다.", "`def 전력량(시간, 와트):` — 함수 이름과 매개변수를 선언하는 부분입니다.", "`return 시간 * 와트 / 1000` — 호출한 곳에 계산 결과를 반환하며 함수를 종료합니다.", "`출력(전력량(5, 200))` — 현재 변수값과 식을 평가한 결과가 실행에 반영됩니다.", "확인 활동: 코드의 자료값 한 개를 바꾸어 해당 연산 또는 분기의 결과를 비교하세요.", "주의할 점: 결과를 예측할 때 출력문뿐 아니라 변수의 변경과 실행 순서를 함께 살펴보세요."], "english": "def energy(hours, watts):\n    return hours * watts / 1000\nprint(energy(5, 200))"}, {"step": 10, "number": 10, "title": "성적 파일 프로젝트", "code": "출력 = print\n길이 = len\n합 = sum\n점수들 = [85, 90, 95]\n평균 = 합(점수들) / 길이(점수들)\nwith open(\"성적.txt\", \"w\", encoding=\"utf-8\") as 파일:\n    파일.write(f\"평균: {평균}\")\n출력(\"성적.txt 저장 완료\")", "desc": ["핵심 원리: 세 점수의 평균을 계산한 뒤 UTF-8 텍스트 파일에 기록합니다.", "코드 적용: 콘솔 완료 메시지와 실제 파일에 저장된 평균값은 서로 다른 출력입니다.", "`점수들 = [85, 90, 95]` — 오른쪽 식을 계산해 왼쪽 대상에 저장하거나 갱신합니다.", "`평균 = 합(점수들) / 길이(점수들)` — 오른쪽 식을 계산해 왼쪽 대상에 저장하거나 갱신합니다.", "`with open(\"성적.txt\", \"w\", encoding=\"utf-8\") as 파일:` — 파일 자원을 열고 블록 종료 시 안전하게 정리합니다.", "`파일.write(f\"평균: {평균}\")` — 현재 변수값과 식을 평가한 결과가 실행에 반영됩니다.", "확인 활동: 코드의 자료값 한 개를 바꾸어 해당 연산 또는 분기의 결과를 비교하세요.", "주의할 점: 결과를 예측할 때 출력문뿐 아니라 변수의 변경과 실행 순서를 함께 살펴보세요."], "english": "scores = [85, 90, 95]\naverage = sum(scores) / len(scores)\nwith open(\"성적.txt\", \"w\", encoding=\"utf-8\") as file:\n    file.write(f\"평균: {average}\")\nprint(\"성적.txt 저장 완료\")"}];
const root=document.getElementById('root'),toc=document.getElementById('toc'),search=document.getElementById('search'),count=document.getElementById('count');
function node(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e;}
STEPS.forEach((s,i)=>{const li=node('li');const a=node('a','',String(i+1).padStart(2,'0')+'단계 · '+s.title+' (10예제)');a.href='#step'+(i+1);li.append(a);toc.append(li)});
async function copyCode(code,button){try{if(navigator.clipboard && window.isSecureContext){await navigator.clipboard.writeText(code)}else{const t=document.createElement('textarea');t.value=code;t.style.position='fixed';t.style.left='-9999px';document.body.append(t);t.select();if(!document.execCommand('copy'))throw Error('copy failed');t.remove()}button.textContent='복사 완료';setTimeout(()=>button.textContent='코드 복사',1500)}catch(e){button.textContent='복사 실패';setTimeout(()=>button.textContent='코드 복사',1500)}}
function render(){const q=search.value.trim().toLowerCase();root.replaceChildren();let total=0;STEPS.forEach((s,i)=>{const items=DATA.filter(x=>x.step===i+1 && (s.title+' '+x.title+' '+x.code+' '+x.desc.join(' ')).toLowerCase().includes(q));if(!items.length)return;const section=node('section','lesson');section.id='step'+(i+1);section.append(node('h2','',(i+1)+'단계. '+s.title),node('p','hint','핵심 개념: '+s.concept),node('h3','','단계 개념 상세 설명'));const ol=node('ol','desc');s.desc.forEach(t=>ol.append(node('li','',t)));section.append(ol);items.forEach(x=>{const art=node('article','example');const head=node('div','headrow');head.append(node('h3','',x.step+'-'+String(x.number).padStart(2,'0')+'. '+x.title));head.append(node('span','hint','한글 ↔ 영문 코드 비교'));art.append(head);const panels=node('div','code-pair');[['한글 파이썬 코드',x.code],['영문 파이썬 코드',x.english]].forEach(([label,code])=>{const panel=node('div','code-panel');const bar=node('div','code-bar');bar.append(node('strong','',label));const b=node('button','','코드 복사');b.addEventListener('click',()=>copyCode(code,b));bar.append(b);panel.append(bar,node('pre','',code));panels.append(panel)});art.append(panels,node('h4','','예제별 핵심 원리 · 실행 과정 · 확인 활동'));const expl=node('ol','desc');x.desc.forEach(t=>expl.append(node('li','',t)));art.append(expl);section.append(art)});root.append(section);total+=items.length});count.textContent='표시 '+total+' / 100개';if(!total)root.append(node('p','','검색 결과가 없습니다.'))}
search.addEventListener('input',render);render();
</script></body></html>
