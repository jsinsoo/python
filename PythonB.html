<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>한글 코드로 배우는 파이썬 중급학습 10단계 100예제</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f3f6fa;color:#182b42;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}header{background:#153c67;color:white;padding:30px max(18px,calc((100vw - 1150px)/2))}h1{margin:0 0 10px;font-size:clamp(23px,3vw,34px)}header p{line-height:1.8;margin:0}.wrap{max-width:1150px;margin:auto;padding:18px}.intro,.lesson,.example{background:white;border:1px solid #dce5ef;border-radius:13px;padding:20px;margin:15px 0}.intro{line-height:1.85}.toc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;list-style:none;padding:0}.toc a{display:block;padding:12px;border-radius:8px;background:#eaf2fc;color:#164b7e;text-decoration:none}.lesson{margin-top:30px}.lesson h2{margin-top:0;border-bottom:2px solid #c7d9eb;padding-bottom:10px}.example{background:#fbfdff}.example h3{margin:0 0 12px}.code-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.code-panel{min-width:0}.code-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#e8f0fa;padding:9px 11px;border-radius:8px 8px 0 0}.code-bar strong{font-size:14px}pre{margin:0;background:#102338;color:#edf5ff;border-radius:0 0 8px 8px;padding:14px;overflow:auto;white-space:pre;font:13px/1.65 Consolas,"D2Coding",monospace;min-height:130px}button{border:0;background:#195b98;color:white;border-radius:7px;padding:9px 12px;cursor:pointer;font-weight:bold}button:hover{background:#0e416f}.desc{line-height:1.9}.desc li{margin-bottom:3px}.hint{color:#52677e;font-size:14px}.tools{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.tools input{font:inherit;flex:1;min-width:200px;padding:11px;border:1px solid #b7c8dc;border-radius:8px}.count{font-weight:bold;margin:16px 0}.headrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}@media(max-width:740px){.toc,.code-pair{grid-template-columns:1fr}}@media print{body{background:white}.tools,button{display:none}.lesson,.example{break-inside:avoid}pre{white-space:pre-wrap;background:#eee;color:#111}}</style></head><body><header><h1>한글 코드로 배우는 파이썬 중급학습 10단계</h1><p>10단계 × 10예제 = 100예제 · 한글 코드 왼쪽 / 영문 코드 오른쪽 · 예제별 코드 맞춤 9항목 해설 · 각각 코드 복사</p></header><main class="wrap"><section class="intro"><h2>학습 안내</h2><p>기초 10단계 다음에 학습하는 중급 과정입니다. 한글 변수명·함수명을 사용하며 <b>파이썬 예약어(if, for, def, return 등)는 영문 그대로</b> 사용합니다. 필요한 내장 함수의 한글 별칭만 각 예제에 포함했습니다. 각 예제는 독립적으로 실행 가능합니다.</p><h2>중급 10단계 목차</h2><ol id="toc" class="toc"></ol><div class="tools"><input id="search" placeholder="개념·예제·코드 검색" aria-label="예제 검색"><button onclick="window.print()">인쇄 / PDF</button></div><p class="count" id="count"></p></section><section id="root"></section></main><script>const STEPS=[{"title": "문자열 심화", "concept": "슬라이싱·메서드·서식·문자열 분석"}, {"title": "컴프리헨션과 반복", "concept": "리스트·딕셔너리·집합 컴프리헨션"}, {"title": "함수 심화", "concept": "기본 인자·가변 인자·람다·스코프"}, {"title": "정렬과 자료구조", "concept": "정렬 기준·스택·큐·힙·빈도"}, {"title": "탐색과 재귀", "concept": "선형 탐색·이진 탐색·DFS·BFS"}, {"title": "파일과 데이터 처리", "concept": "텍스트·CSV·JSON·경로·집계"}, {"title": "예외 처리와 검증", "concept": "try·except·raise·assert·입력 검증"}, {"title": "객체지향 프로그래밍", "concept": "클래스·생성자·상속·프로퍼티"}, {"title": "표준 라이브러리 활용", "concept": "math·statistics·itertools·collections"}, {"title": "알고리즘 프로젝트", "concept": "DP·그리디·경로·성적·모델링"}];const DATA=[{"step":1,"number":1,"title":"문자열 뒤집기","english":"word = \"algorithm\"\nprint(word[::-1])","code":"출력 = print\n\n단어 = \"algorithm\"\n출력(단어[::-1])","desc":["학습 초점: 문자열을 [::-1]로 읽으면 마지막 글자부터 첫 글자까지 역순으로 이어 붙인다.","자료와 시작 상태: `word = \"algorithm\"` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: word = \"algorithm\" / print(word[::-1]) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(단어[::-1])`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":1,"number":2,"title":"문자열 구간 추출","english":"sentence = \"Python is fun\"\nprint(sentence[0:6])\nprint(sentence[-3:])","code":"출력 = print\n\n문장 = \"Python is fun\"\n출력(문장[0:6])\n출력(문장[-3:])","desc":["학습 초점: [0:6]은 인덱스 0~5의 Python을, [-3:]은 끝 세 글자 fun을 추출한다.","자료와 시작 상태: `sentence = \"Python is fun\"` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: print(sentence[0:6]) / print(sentence[-3:]) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(문장[-3:])`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":1,"number":3,"title":"문자 빈도 계산","english":"text = \"banana\"\nfor letter in sorted(set(text)):\n    print(letter, text.count(letter))","code":"정렬 = sorted\n집합 = set\n출력 = print\n\n글 = \"banana\"\nfor 글자 in 정렬(집합(글)):\n    출력(글자, 글.count(글자))","desc":["학습 초점: set으로 중복 문자를 제거하고 sorted로 순서를 고정한 뒤 count로 각각의 등장 횟수를 센다.","자료와 시작 상태: `text = \"banana\"` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: for letter in sorted(set(text)): / print(letter, text.count(letter)) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 조건 분기와 반복을 따라 실제로 실행되는 경로를 확인한다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 원본 자료의 변경 여부와 새 객체 생성 여부를 구분한다.","한글·영문 대응: `출력(글자, 글.count(글자))`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":1,"number":4,"title":"공백 제거","english":"text = \"  hello python  \"\nclean = text.strip()\nprint(clean, len(clean))","code":"출력 = print\n길이 = len\n\n글 = \"  hello python  \"\n정리문 = 글.strip()\n출력(정리문, 길이(정리문))","desc":["학습 초점: strip은 문자열 양 끝의 공백만 제거하며 단어 사이 공백은 그대로 둔다.","자료와 시작 상태: `text = \"  hello python  \"` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: clean = text.strip() / print(clean, len(clean)) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 nglish":"names = [\"A\", \"BB\", \"CCC\"]\nlengths = {name: len(name) for name in names}\nprint(lengths)","code":"길이 = len\n출력 = print\n\nnames = [\"A\", \"BB\", \"CCC\"]\n길이표 = {이름: 길이(이름) for 이름 in names}\n출력(길이표)","desc":["학습 초점: 이름을 키, 이름의 글자 수를 값으로 하는 딕셔너리를 구성한다.","자료와 시작 상태: `names = [\"A\", \"BB\", \"CCC\"]` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: lengths = {name: len(name) for name in names} / print(lengths) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 조건 분기와 반복을 따라 실제로 실행되는 경로를 확인한다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(길이표)`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":2,"number":7,"title":"집합 컴프리헨션","english":"numbers = [1, 2, 2, 3, 3]\nsquares = {n * n for n in numbers}\nprint(sorted(squares))","code":"출력 = print\n정렬 = sorted\n\n숫자들 = [1, 2, 2, 3, 3]\n제곱들 = {수 * 수 for 수 in 숫자들}\n출력(정렬(제곱들))","desc":["학습 초점: 집합 컴프리헨션으로 제곱값을 만들면서 중복을 없애고 정렬해 출력한다.","자료와 시작 상태: `numbers = [1, 2, 2, 3, 3]` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: squares = {n * n for n in numbers} / print(sorted(squares)) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 조건 분기와 반복을 따라 실제로 실행되는 경로를 확인한다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 원본 자료의 변경 여부와 새 객체 생성 여부를 구분한다.","한글·영문 대응: `출력(정렬(제곱들))`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":2,"number":8,"title":"조건부 딕셔너리","english":"scores = {\"A\": 90, \"B\": 60, \"C\": 85}\npassed = {name: score for name, score in scores.items() if score >= 80}\nprint(passed)","code":"출력 = print\n\n점수표 = {\"A\": 90, \"B\": 60, \"C\": 85}\n통과표 = {이름: 점수 for 이름, 점수 in 점수표.items() if 점수 >= 80}\n출력(통과표)","desc":["학습 초점: items로 이름과 점수를 함께 꺼내 80점 이상인 항목만 남긴다.","자료와 시작 상태: `scores = {\"A\": 90, \"B\": 60, \"C\": 85}` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: passed = {name: score for name, score in scores.items() if score >= 80} / print(passed) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 조건 분기와 반복을 따라 실제로 실행되는 경로를 확인한다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(통과표)`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":2,"number":9,"title":"enumerate 활용","english":"colors = [\"red\", \"blue\", \"green\"]\nindexed = [(i, color) for i, color in enumerate(colors, 1)]\nprint(indexed)","code":"번호붙이기 = enumerate\n출력 = print\n\n색들 = [\"red\", \"blue\", \"green\"]\n번호목록 = [(번호, 색) for 번호, 색 in 번호붙이기(색들, 1)]\n출력(번호목록)","desc":["학습 초점: enumerate의 시작 번호를 1로 지정해 색 이름에 순번을 붙인다.","자료와 시작 상태: `colors = [\"red\", \"blue\", \"green\"]` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: indexed = [(i, color) for i, color in enumerate(colors, 1)] / print(indexed) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 조건 분기와 반복을 따라 실제로 실행되는 경로를 확인한다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(번호목록)`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":2,"number":10,"title":"zip 결합","english":"names = [\"A\", \"B\", \"C\"]\nscores = [90, 80, 95]\nrecord = dict(zip(names, scores))\nprint(record)","code":"사전 = dict\n묶기 = zip\n출력 = print\n\nnames = [\"A\", \"B\", \"C\"]\n점수표 = [90, 80, 95]\n기록 = 사전(묶기(names, 점수표))\n출력(기록)","desc":["학습 초점: zip으로 이름과 점수를 같은 위치끼리 묶고 dict로 점수표를 만든다.","자료와 시작 상태: `names = [\"A\", \"B\", \"C\"]` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: record = dict(zip(names, scores)) / print(record) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(기록)`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":3,"number":1,"title":"기본 매개변수","english":"def greet(name, message=\"Hello\"):\n    return f\"{message}, {name}\"\nprint(greet(\"Mina\"))","code":"출력 = print\n\ndef 인사(이름, 메시지=\"Hello\"):\n    return f\"{메시지}, {이름}\"\n출력(인사(\"Mina\"))","desc":["학습 초점: 메시지를 전달하지 않으면 기본값 Hello가 사용되고 이름 Mina와 결합된다.","자료와 시작 상태: `def greet(name, message=\"Hello\"):` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: return f\"{message}, {name}\" / print(greet(\"Mina\")) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: return은 값을 호출한 위치로 돌려주며 함수 실행을 끝낸다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(인사(\"Mina\"))`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":3,"number":2,"title":"키워드 인자","english":"def rectangle(width, height):\n    return width * height\nprint(rectangle(height=3, width=5))","code":"출력 = print\n\ndef 직사각형(너비, 높이):\n    return 너비 * 높이\n출력(직사각형(높이=3, 너비=5))","desc":["학습 초점: 키워드 인자는 전달 순서가 달라도 너비 5와 높이 3에 정확히 대응한다.","자료와 시작 상태: `def rectangle(width, height):` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: return width * height / print(rectangle(height=3, width=5)) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: return은 값을 호출한 위치로 돌려주며 함수 실행을 끝낸다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(직사각형(높이=3, 너비=5))`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":3,"number":3,"title":"가변 위치 인자","english":"def total(*numbers):\n    return sum(numbers)\nprint(total(2, 4, 6))","code":"합 = sum\n출력 = print\n\ndef 합계(*숫자들):\n    return 합(숫자들)\n출력(합계(2, 4, 6))","desc":["학습 초점: 별표 매개변수는 여러 숫자를 튜플로 받아 sum으로 합산한다.","자료와 시작 상태: `def total(*numbers):` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: return sum(numbers) / print(total(2, 4, 6)) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: return은 값을 호출한 위치로 돌려주며 함수 실행을 끝낸다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(합계(2, 4, 6))`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":3,"number":4,"title":"가변 키워드 인자","english":"def describe(**info):\n    return sorted(info.items())\nprint(describe(age=17, grade=2))","code":"정렬 = sorted\n출력 = print\n\ndef 설명(**정보):\n    return 정렬(정보.items())\n출력(설명(age=17, grade=2))","desc":["학습 초점: 이중 별표 매개변수는 age와 grade를 딕셔너리로 받고 항목을 정렬한다.","자료와 시작 상태: `def describe(**info):` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: return sorted(info.items()) / print(describe(age=17, grade=2)) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: return은 값을 호출한 위치로 돌려주며 함수 실행을 끝낸다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 원본 자료의 변경 여부와 새 객체 생성 여부를 구분한다.","한글·영문 대응: `출력(설명(age=17, grade=2))`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":3,"number":5,"title":"여러 값 반환","english":"def divide(a, b):\n    return a // b, a % b\nprint(divide(17, 5))","code":"출력 = print\n\ndef 나누기(가, 나):\n    return 가 // 나, 가 % 나\n출력(나누기(17, 5))","desc":["학습 초점: 몫 연산과 나머지 연산을 함께 반환하므로 결과는 두 원소의 튜플이다.","자료와 시작 상태: `def divide(a, b):` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: return a // b, a % b / print(divide(17, 5)) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: return은 값을 호출한 위치로 돌려주며 함수 실행을 끝낸다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(나누기(17, 5))`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":3,"number":6,"title":"람다 함수","english":"numbers = [4, 1, 3]\nprint(sorted(numbers, key=lambda n: -n))","code":"출력 = print\n정렬 = sorted\n\n숫자들 = [4, 1, 3]\n출력(정렬(숫자들, key=lambda 수: -수))","desc":["학습 초점: lambda가 수의 부호를 반대로 바꾸어 정렬 기준으로 제공하므로 내림차순이 된다.","자료와 시작 상태: `numbers = [4, 1, 3]` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: numbers = [4, 1, 3] / print(sorted(numbers, key=lambda n: -n)) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 원본 자료의 변경 여부와 새 객체 생성 여부를 구분한다.","한글·영문 대응: `출력(정렬(숫자들, key=lambda 수: -수))`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":3,"number":7,"title":"함수 합성","english":"def double(n):\n    return n * 2\ndef add_one(n):\n    return n + 1\nprint(add_one(double(5)))","code":"출력 = print\n\ndef 두배(수):\n    return 수 * 2\ndef 하나더하기(수):\n    return 수 + 1\n출력(하나더하기(두배(5)))","desc":["학습 초점: 먼저 5를 두 배로 만들고 그 결과에 1을 더하는 함수 합성이다.","자료와 시작 상태: `def double(n):` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: return n + 1 / print(add_one(double(5))) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: return은 값을 호출한 위치로 돌려주며 함수 실행을 끝낸다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(하나더하기(두배(5)))`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":3,"number":8,"title":"클로저","english":"def multiplier(factor):\n    def apply(value):\n        return factor * value\n    return apply\ntriple = multiplier(3)\nprint(triple(7))","code":"출력 = print\n\ndef 배수함수(배수):\n    def 적용(값):\n        return 배수 * 값\n    return 적용\n세배 = 배수함수(3)\n출력(세배(7))","desc":["학습 초점: 안쪽 함수가 바깥 함수의 배수 3을 기억하므로 나중에 7을 넣어도 세 배가 된다.","자료와 시작 상태: `def multiplier(factor):` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: triple = multiplier(3) / print(triple(7)) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: return은 값을 호출한 위치로 돌려주며 함수 실행을 끝낸다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(세배(7))`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":3,"number":9,"title":"재귀 팩토리얼","english":"def factorial(n):\n    if n <= 1:\n        return 1\n    return n * factorial(n - 1)\nprint(factorial(5))","code":"출력 = print\n\ndef 계승(수):\n    if 수 <= 1:\n        return 1\n    return 수 * 계승(수 - 1)\n출력(계승(5))","desc":["학습 초점: n이 1 이하이면 재귀를 멈추고, 그렇지 않으면 n과 (n-1)!을 곱한다.","자료와 시작 상태: `def factorial(n):` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: return n * factorial(n - 1) / print(factorial(5)) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 조건 분기와 반복을 따라 실제로 실행되는 경로를 확인한다.","핵심 표현: return은 값을 호출한 위치로 돌려주며 함수 실행을 끝낸다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(계승(5))`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":3,"number":10,"title":"함수 주석과 타입 힌트","english":"def average(numbers: list[float]) -> float:\n    \"\"\"숫자들의 평균을 구한다.\"\"\"\n    return sum(numbers) / len(numbers)\nprint(average([80, 90, 100]))","code":"목록 = list\n실수 = float\n합 = sum\n길이 = len\n출력 = print\n\ndef 평균(숫자들: 목록[실수]) -> 실수:\n    \"\"\"숫자들의 평균을 구한다.\"\"\"\n    return 합(숫자들) / 길이(숫자들)\n출력(평균([80, 90, 100]))","desc":["학습 초점: 타입 힌트는 숫자 목록과 실수 반환을 설명하며 평균은 합계를 개수로 나눈다.","자료와 시작 상태: `def average(numbers: list[float]) -> float:` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: return sum(numbers) / len(numbers) / print(average([80, 90, 100])) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: return은 값을 호출한 위치로 돌려주며 함수 실행을 끝낸다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(평균([80, 90, 100]))`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":4,"number":1,"title":"기본 정렬과 역순","english":"numbers = [7, 2, 9, 1]\nprint(sorted(numbers))\nprint(sorted(numbers, reverse=True))","code":"출력 = print\n정렬 = sorted\n\n숫자들 = [7, 2, 9, 1]\n출력(정렬(숫자들))\n출력(정렬(숫자들, reverse=True))","desc":["학습 초점: sorted의 기본 오름차순과 reverse=True의 내림차순 결과를 비교한다.","자료와 시작 상태: `numbers = [7, 2, 9, 1]` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: print(sorted(numbers)) / print(sorted(numbers, reverse=True)) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 원본 자료의 변경 여부와 새 객체 생성 여부를 구분한다.","한글·영문 대응: `출력(정렬(숫자들, reverse=True))`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":4,"number":2,"title":"문자열 길이 기준 정렬","english":"words = [\"pear\", \"fig\", \"banana\"]\nprint(sorted(words, key=len))","code":"출력 = print\n정렬 = sorted\n길이 = len\n\n단어들 = [\"pear\", \"fig\", \"banana\"]\n출력(정렬(단어들, key=길이))","desc":["학습 초점: 단어의 길이를 비교하여 짧은 fig부터 긴 banana까지 정렬한다.","자료와 시작 상태: `words = [\"pear\", \"fig\", \"banana\"]` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: words = [\"pear\", \"fig\", \"banana\"] / print(sorted(words, key=len)) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 원본 자료의 변경 여부와 새 객체 생성 여부를 구분한다.","한글·영문 대응: `출력(정렬(단어들, key=길이))`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":4,"number":3,"title":"튜플 두 번째 값 정렬","english":"pairs = [(\"A\", 80), (\"B\", 95), (\"C\", 70)]\nprint(sorted(pairs, key=lambda pair: pair[1]))","code":"출력 = print\n정렬 = sorted\n\n쌍들 = [(\"A\", 80), (\"B\", 95), (\"C\", 70)]\n출력(정렬(쌍들, key=lambda 쌍: 쌍[1]))","desc":["학습 초점: 각 튜플의 두 번째 요소인 점수를 기준으로 A·B·C의 순서를 재배치한다.","자료와 시작 상태: `pairs = [(\"A\", 80), (\"B\", 95), (\"C\", 70)]` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: pairs = [(\"A\", 80), (\"B\", 95), (\"C\", 70)] / print(sorted(pairs, key=lambda pair: pair[1])) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 원본 자료의 변경 여부와 새 객체 생성 여부를 구분한다.","한글·영문 대응: `출력(정렬(쌍들, key=lambda 쌍: 쌍[1]))`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":4,"number":4,"title":"스택 push와 pop","english":"stack = []\nstack.append(10)\nstack.append(20)\nprint(stack.pop())\nprint(stack)","code":"출력 = print\n\n스택 = []\n스택.append(10)\n스택.append(20)\n출력(스택.pop())\n출력(스택)","desc":["학습 초점: append로 10과 20을 넣고 pop으로 가장 나중에 넣은 20을 꺼낸다.","자료와 시작 상태: `stack = []` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: print(stack.pop()) / print(stack) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 원본 자료의 변경 여부와 새 객체 생성 여부를 구분한다.","한글·영문 대응: `출력(스택)`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":4,"number":5,"title":"큐 삽입과 삭제","english":"from collections import deque\nqueue = deque([1, 2])\nqueue.append(3)\nprint(queue.popleft())\nprint(list(queue))","code":"출력 = print\n목록 = list\n\nfrom collections import deque\n큐 = deque([1, 2])\n큐.append(3)\n출력(큐.popleft())\n출력(목록(큐))","desc":["학습 초점: deque의 append는 뒤에 넣고 popleft는 앞에서 꺼내므로 선입선출을 확인한다.","자료와 시작 상태: `queue = deque([1, 2])` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: print(queue.popleft()) / print(list(queue)) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 원본 자료의 변경 여부와 새 객체 생성 여부를 구분한다.","한글·영문 대응: `출력(목록(큐))`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":4,"number":6,"title":"우선순위 큐","english":"import heapq\nheap = [5, 1, 4]\nheapq.heapify(heap)\nprint(heapq.heappop(heap))","code":"출력 = print\n\nimport heapq\n힙 = [5, 1, 4]\nheapq.heapify(힙)\n출력(heapq.heappop(힙))","desc":["학습 초점: heapify는 리스트를 최소 힙으로 바꾸고 heappop은 최솟값을 꺼낸다.","자료와 시작 상태: `heap = [5, 1, 4]` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: heapq.heapify(heap) / print(heapq.heappop(heap)) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 원본 자료의 변경 여부와 새 객체 생성 여부를 구분한다.","한글·영문 대응: `출력(heapq.heappop(힙))`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":4,"number":7,"title":"빈도 계산","english":"from collections import Counter\ncolors = [\"red\", \"blue\", \"red\", \"green\", \"red\"]\nfrequency = Counter(colors)\nprint(frequency.most_common(2))","code":"출력 = print\n\nfrom collections import Counter\n색들 = [\"red\", \"blue\", \"red\", \"green\", \"red\"]\n빈도 = Counter(색들)\n출력(빈도.most_common(2))","desc":["학습 초점: Counter로 색깔별 횟수를 세고 most_common(2)로 빈도가 높은 두 항목을 선택한다.","자료와 시작 상태: `colors = [\"red\", \"blue\", \"red\", \"green\", \"red\"]` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: frequency = Counter(colors) / print(frequency.most_common(2)) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(빈도.most_common(2))`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":4,"number":8,"title":"딕셔너리 안전 조회","english":"scores = {\"A\": 90}\nprint(scores.get(\"B\", 0))\nprint(scores.get(\"A\", 0))","code":"출력 = print\n\n점수표 = {\"A\": 90}\n출력(점수표.get(\"B\", 0))\n출력(점수표.get(\"A\", 0))","desc":["학습 초점: get의 기본값 0 덕분에 없는 키 B를 조회해도 KeyError가 발생하지 않는다.","자료와 시작 상태: `scores = {\"A\": 90}` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: print(scores.get(\"B\", 0)) / print(scores.get(\"A\", 0)) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(점수표.get(\"A\", 0))`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":4,"number":9,"title":"집합 연산","english":"a = {1, 2, 3}\nb = {3, 4, 5}\nprint(sorted(a & b))\nprint(sorted(a | b))","code":"출력 = print\n정렬 = sorted\n\n가 = {1, 2, 3}\n나 = {3, 4, 5}\n출력(정렬(가 & 나))\n출력(정렬(가 | 나))","desc":["학습 초점: 교집합은 두 집합에 모두 속하는 수, 합집합은 어느 한쪽에라도 속하는 수이다.","자료와 시작 상태: `a = {1, 2, 3}` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: print(sorted(a & b)) / print(sorted(a | b)) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 원본 자료의 변경 여부와 새 객체 생성 여부를 구분한다.","한글·영문 대응: `출력(정렬(가 | 나))`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":4,"number":10,"title":"중복 제거와 순서 유지","english":"numbers = [3, 1, 3, 2, 1]\nunique = list(dict.fromkeys(numbers))\nprint(unique)","code":"목록 = list\n사전 = dict\n출력 = print\n\n숫자들 = [3, 1, 3, 2, 1]\n고유목록 = 목록(사전.fromkeys(숫자들))\n출력(고유목록)","desc":["학습 초점: dict.fromkeys는 처음 나타난 순서대로 키를 유지하여 중복을 제거한다.","자료와 시작 상태: `numbers = [3, 1, 3, 2, 1]` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: unique = list(dict.fromkeys(numbers)) / print(unique) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(고유목록)`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":5,"number":1,"title":"선형 탐색","english":"numbers = [4, 7, 2, 9]\ntarget = 2\nindex = next((i for i, n in enumerate(numbers) if n == target), -1)\nprint(index)","code":"다음값 = next\n번호붙이기 = enumerate\n출력 = print\n\n숫자들 = [4, 7, 2, 9]\n목표 = 2\n위치 = 다음값((번호 for 번호, 수 in 번호붙이기(숫자들) if 수 == 목표), -1)\n출력(위치)","desc":["학습 초점: enumerate로 위치와 값을 조사하고 목표 2가 처음 나타나는 인덱스를 찾는다.","자료와 시작 상태: `numbers = [4, 7, 2, 9]` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: index = next((i for i, n in enumerate(numbers) if n == target), -1) / print(index) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 조건 분기와 반복을 따라 실제로 실행되는 경로를 확인한다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(위치)`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 목표값이나 자료의 순서를 바꾸고 방문 순서와 결과를 비교한다."]},{"step":5,"number":2,"title":"이진 탐색","english":"numbers = [1, 3, 5, 7, 9]\ntarget = 7\nleft, right = 0, len(numbers) - 1\nwhile left <= right:\n    mid = (left + right) // 2\n    if numbers[mid] == target:\n        print(mid)\n        break\n    if numbers[mid] < target:\n        left = mid + 1\n    else:\n        right = mid - 1","code":"길이 = len\n출력 = print\n\n숫자들 = [1, 3, 5, 7, 9]\n목표 = 7\n왼쪽, 오른쪽 = 0, 길이(숫자들) - 1\nwhile 왼쪽 <= 오른쪽:\n    중간 = (왼쪽 + 오른쪽) // 2\n    if 숫자들[중간] == 목표:\n        출력(중간)\n        break\n    if 숫자들[중간] < 목표:\n        왼쪽 = 중간 + 1\n    else:\n        오른쪽 = 중간 - 1","desc":["학습 초점: 정렬된 목록의 가운데 값을 비교해 왼쪽 또는 오른쪽 절반만 남긴다.","자료와 시작 상태: `numbers = [1, 3, 5, 7, 9]` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: else: / right = mid - 1 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 조건 분기와 반복을 따라 실제로 실행되는 경로를 확인한다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `오른쪽 = 중간 - 1`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 목표값이나 자료의 순서를 바꾸고 방문 순서와 결과를 비교한다."]},{"step":5,"number":3,"title":"재귀 합계","english":"def recursive_sum(n):\n    if n == 0:\n        return 0\n    return n + recursive_sum(n - 1)\nprint(recursive_sum(5))","code":"출력 = print\n\ndef 재귀합(수):\n    if 수 == 0:\n        return 0\n    return 수 + 재귀합(수 - 1)\n출력(재귀합(5))","desc":["학습 초점: 0에서 재귀를 멈추고 되돌아오면서 1부터 5까지 더한다.","자료와 시작 상태: `def recursive_sum(n):` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: return n + recursive_sum(n - 1) / print(recursive_sum(5)) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 조건 분기와 반복을 따라 실제로 실행되는 경로를 확인한다.","핵심 표현: return은 값을 호출한 위치로 돌려주며 함수 실행을 끝낸다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(재귀합(5))`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 목표값이나 자료의 순서를 바꾸고 방문 순서와 결과를 비교한다."]},{"step":5,"number":4,"title":"최대공약수","english":"def gcd(a, b):\n    while b:\n        a, b = b, a % b\n    return a\nprint(gcd(36, 24))","code":"출력 = print\n\ndef 최대공약수(가, 나):\n    while 나:\n        가, 나 = 나, 가 % 나\n    return 가\n출력(최대공약수(36, 24))","desc":["학습 초점: 유클리드 호제법은 (a,b)를 (b,a%b)로 반복 갱신하여 최대공약수를 찾는다.","자료와 시작 상태: `def gcd(a, b):` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: return a / print(gcd(36, 24)) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 조건 분기와 반복을 따라 실제로 실행되는 경로를 확인한다.","핵심 표현: return은 값을 호출한 위치로 돌려주며 함수 실행을 끝낸다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(최대공약수(36, 24))`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 목표값이나 자료의 순서를 바꾸고 방문 순서와 결과를 비교한다."]},{"step":5,"number":5,"title":"부분집합 만들기","english":"numbers = [1, 2, 3]\nresult = [[]]\nfor n in numbers:\n    result += [part + [n] for part in result]\nprint(result)","code":"출력 = print\n\n숫자들 = [1, 2, 3]\n결과 = [[]]\nfor 수 in 숫자들:\n    결과 += [부분 + [수] for 부분 in 결과]\n출력(결과)","desc":["학습 초점: 빈 부분집합에서 시작해 새 원소를 포함하는 경우를 기존 목록에 추가한다.","자료와 시작 상태: `numbers = [1, 2, 3]` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: result += [part + [n] for part in result] / print(result) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 조건 분기와 반복을 따라 실제로 실행되는 경로를 확인한다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(결과)`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 목표값이나 자료의 순서를 바꾸고 방문 순서와 결과를 비교한다."]},{"step":5,"number":6,"title":"DFS 탐색","english":"graph = {0: [1, 2], 1: [3], 2: [], 3: []}\nvisited = set()\ndef dfs(node):\n    if node in visited:\n        return\n    visited.add(node)\n    print(node)\n    for nxt in graph[node]:\n        dfs(nxt)\ndfs(0)","code":"집합 = set\n출력 = print\n\n그래프 = {0: [1, 2], 1: [3], 2: [], 3: []}\n방문 = 집합()\ndef 깊이탐색(정점):\n    if 정점 in 방문:\n        return\n    방문.add(정점)\n    출력(정점)\n    for 다음정점 in 그래프[정점]:\n        깊이탐색(다음정점)\n깊이탐색(0)","desc":["학습 초점: DFS는 한 경로를 깊게 따라간 뒤 되돌아와 다른 이웃을 탐색한다.","자료와 시작 상태: `graph = {0: [1, 2], 1: [3], 2: [], 3: []}` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: dfs(nxt) / dfs(0) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 조건 분기와 반복을 따라 실제로 실행되는 경로를 확인한다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `깊이탐색(0)`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 목표값이나 자료의 순서를 바꾸고 방문 순서와 결과를 비교한다."]},{"step":5,"number":7,"title":"BFS 탐색","english":"from collections import deque\ngraph = {0: [1, 2], 1: [3], 2: [], 3: []}\nqueue = deque([0])\nvisited = {0}\nwhile queue:\n    node = queue.popleft()\n    print(node)\n    for nxt in graph[node]:\n        if nxt not in visited:\n            visited.add(nxt)\n            queue.append(nxt)","code":"출력 = print\n\nfrom collections import deque\n그래프 = {0: [1, 2], 1: [3], 2: [], 3: []}\n큐 = deque([0])\n방문 = {0}\nwhile 큐:\n    정점 = 큐.popleft()\n    출력(정점)\n    for 다음정점 in 그래프[정점]:\n        if 다음정점 not in 방문:\n            방문.add(다음정점)\n            큐.append(다음정점)","desc":["학습 초점: BFS는 큐에 들어간 순서대로 정점을 꺼내 가까운 정점부터 방문한다.","자료와 시작 상태: `graph = {0: [1, 2], 1: [3], 2: [], 3: []}` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: visited.add(nxt) / queue.append(nxt) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 조건 분기와 반복을 따라 실제로 실행되는 경로를 확인한다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 원본 자료의 변경 여부와 새 객체 생성 여부를 구분한다.","한글·영문 대응: `큐.append(다음정점)`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 목표값이나 자료의 순서를 바꾸고 방문 순서와 결과를 비교한다."]},{"step":5,"number":8,"title":"백트래킹 순열","english":"def permutations(path, rest):\n    if not rest:\n        print(path)\n        return\n    for n in rest:\n        permutations(path + [n], [x for x in rest if x != n])\npermutations([], [1, 2, 3])","code":"출력 = print\n\ndef 순열생성(경로, 남은값):\n    if not 남은값:\n        출력(경로)\n        return\n    for 수 in 남은값:\n        순열생성(경로 + [수], [원소 for 원소 in 남은값 if 원소 != 수])\n순열생성([], [1, 2, 3])","desc":["학습 초점: 선택한 원소를 제외한 후보를 재귀적으로 탐색하여 서로 다른 순열을 만든다.","자료와 시작 상태: `def permutations(path, rest):` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: permutations(path + [n], [x for x in rest if x != n]) / permutations([], [1, 2, 3]) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 조건 분기와 반복을 따라 실제로 실행되는 경로를 확인한다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `순열생성([], [1, 2, 3])`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 목표값이나 자료의 순서를 바꾸고 방문 순서와 결과를 비교한다."]},{"step":5,"number":9,"title":"가지치기 부분합","english":"numbers = [2, 4, 6]\ndef search(start, path, total):\n    if total > 6:\n        return\n    print(path)\n    for i in range(start, len(numbers)):\n        search(i + 1, path + [numbers[i]], total + numbers[i])\nsearch(0, [], 0)","code":"출력 = print\n범위 = range\n길이 = len\n\n숫자들 = [2, 4, 6]\ndef 탐색(시작, 경로, 합계):\n    if 합계 > 6:\n        return\n    출력(경로)\n    for 번호 in 범위(시작, 길이(숫자들)):\n        탐색(번호 + 1, 경로 + [숫자들[번호]], 합계 + 숫자들[번호])\n탐색(0, [], 0)","desc":["학습 초점: 부분합이 목표를 넘는 분기는 더 진행하지 않아 불필요한 탐색을 줄인다.","자료와 시작 상태: `numbers = [2, 4, 6]` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: search(i + 1, path + [numbers[i]], total + numbers[i]) / search(0, [], 0) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 조건 분기와 반복을 따라 실제로 실행되는 경로를 확인한다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `탐색(0, [], 0)`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 목표값이나 자료의 순서를 바꾸고 방문 순서와 결과를 비교한다."]},{"step":5,"number":10,"title":"이분 탐색 라이브러리","english":"from bisect import bisect_left\nnumbers = [1, 3, 5, 7]\nprint(bisect_left(numbers, 4))","code":"출력 = print\n\nfrom bisect import bisect_left\n숫자들 = [1, 3, 5, 7]\n출력(bisect_left(숫자들, 4))","desc":["학습 초점: bisect 계열 함수는 정렬된 자료에서 삽입 위치를 이진 탐색으로 찾는다.","자료와 시작 상태: `numbers = [1, 3, 5, 7]` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: numbers = [1, 3, 5, 7] / print(bisect_left(numbers, 4)) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(bisect_left(숫자들, 4))`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 목표값이나 자료의 순서를 바꾸고 방문 순서와 결과를 비교한다."]},{"step":6,"number":1,"title":"텍스트 메모리 파일","english":"from io import StringIO\nfile = StringIO()\nfile.write(\"첫째 줄\\n둘째 줄\")\nfile.seek(0)\nprint(file.read())","code":"출력 = print\n\nfrom io import StringIO\n파일 = StringIO()\n파일.write(\"첫째 줄\\n둘째 줄\")\n파일.seek(0)\n출력(파일.read())","desc":["학습 초점: StringIO는 디스크 파일을 만들지 않고 문자열을 파일처럼 읽고 쓴다.","자료와 시작 상태: `file = StringIO()` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: file.seek(0) / print(file.read()) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(파일.read())`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":6,"number":2,"title":"텍스트 줄 단위 처리","english":"text = \"apple\\nbanana\\ncherry\"\nlines = text.splitlines()\nfor line in lines:\n    print(line.upper())","code":"출력 = print\n\n글 = \"apple\\nbanana\\ncherry\"\n줄들 = 글.splitlines()\nfor 줄 in 줄들:\n    출력(줄.upper())","desc":["학습 초점: splitlines는 여러 줄의 텍스트를 줄 단위 문자열 목록으로 분리한다.","자료와 시작 상태: `text = \"apple\\nbanana\\ncherry\"` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: for line in lines: / print(line.upper()) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 조건 분기와 반복을 따라 실제로 실행되는 경로를 확인한다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(줄.upper())`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":6,"number":3,"title":"CSV 데이터 읽기","english":"import csv\nfrom io import StringIO\ndata = StringIO(\"name,score\\nA,90\\nB,80\")\nrows = list(csv.DictReader(data))\nprint(rows)","code":"목록 = list\n출력 = print\n\nimport csv\nfrom io import StringIO\n자료 = StringIO(\"name,score\\nA,90\\nB,80\")\n행들 = 목록(csv.DictReader(자료))\n출력(행들)","desc":["학습 초점: csv.reader는 쉼표로 구분된 행을 필드 목록으로 읽는다.","자료와 시작 상태: `data = StringIO(\"name,score\\nA,90\\nB,80\")` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: rows = list(csv.DictReader(data)) / print(rows) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(행들)`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":6,"number":4,"title":"CSV 데이터 쓰기","english":"import csv\nfrom io import StringIO\nfile = StringIO()\nwriter = csv.writer(file)\nwriter.writerow([\"name\", \"score\"])\nwriter.writerow([\"A\", 95])\nprint(file.getvalue())","code":"출력 = print\n\nimport csv\nfrom io import StringIO\n파일 = StringIO()\n작성기 = csv.writer(파일)\n작성기.writerow([\"name\", \"score\"])\n작성기.writerow([\"A\", 95])\n출력(파일.getvalue())","desc":["학습 초점: csv.writer는 열 값들을 C ry가 정상 종료되면 else가 실행되고 finally는 성공·실패와 관계없이 실행된다.","자료와 시작 상태: `try:` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: finally: / print(\"검사 종료\") 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(\"검사 종료\")`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":7,"number":5,"title":"사용자 정의 오류","english":"def check_score(score):\n    if not 0 <= score <= 100:\n        raise ValueError(\"점수 범위 오류\")\n    return score\nprint(check_score(85))","code":"출력 = print\n\ndef 점수검사(점수):\n    if not 0 <= 점수 <= 100:\n        raise ValueError(\"점수 범위 오류\")\n    return 점수\n출력(점수검사(85))","desc":["학습 초점: 조건을 만족하지 않으면 raise로 직접 예외를 발생시킨다.","자료와 시작 상태: `def check_score(score):` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: return score / print(check_score(85)) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 조건 분기와 반복을 따라 실제로 실행되는 경로를 확인한다.","핵심 표현: return은 값을 호출한 위치로 돌려주며 함수 실행을 끝낸다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(점수검사(85))`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":7,"number":6,"title":"assert 검사","english":"numbers = [1, 2, 3]\nassert len(numbers) == 3\nprint(\"검증 성공\")","code":"길이 = len\n출력 = print\n\n숫자들 = [1, 2, 3]\nassert 길이(숫자들) == 3\n출력(\"검증 성공\")","desc":["학습 초점: assert는 개발 중 전제 조건이 참인지 검사하며 거짓이면 AssertionError를 낸다.","자료와 시작 상태: `numbers = [1, 2, 3]` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: assert len(numbers) == 3 / print(\"검증 성공\") 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(\"검증 성공\")`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":7,"number":7,"title":"입력 범위 검증","english":"age = 17\nvalid = isinstance(age, int) and 0 <= age <= 120\nprint(valid)","code":"형확인 = isinstance\n정수 = int\n출력 = print\n\n나이 = 17\n유효 = 형확인(나이, 정수) and 0 <= 나이 <= 120\n출력(유효)","desc":["학습 초점: 허용 범위를 벗어나는 입력을 조건문으로 거부한다.","자료와 시작 상태: `age = 17` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: valid = isinstance(age, int) and 0 <= age <= 120 / print(valid) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(유효)`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":7,"number":8,"title":"빈 리스트 예외 방지","english":"numbers = []\naverage = sum(numbers) / len(numbers) if numbers else None\nprint(average)","code":"합 = sum\n길이 = len\n출력 = print\n\n숫자들 = []\n평균 = 합(숫자들) / 길이(숫자들) if 숫자들 else None\n출력(평균)","desc":["학습 초점: 빈 리스트에서 원소를 꺼내기 전에 비어 있는지 검사한다.","자료와 시작 상태: `numbers = []` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: average = sum(numbers) / len(numbers) if numbers else None / print(average) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 조건 분기와 반복을 따라 실제로 실행되는 경로를 확인한다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(평균)`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":7,"number":9,"title":"딕셔너리 키 검증","english":"student = {\"name\": \"A\"}\nif \"score\" not in student:\n    student[\"score\"] = 0\nprint(student)","code":"출력 = print\n\n학생 = {\"name\": \"A\"}\nif \"score\" not in 학생:\n    학생[\"score\"] = 0\n출력(학생)","desc":["학습 초점: 딕셔너리에 키가 존재하는지 확인해 잘못된 조회를 방지한다.","자료와 시작 상태: `student = {\"name\": \"A\"}` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: student[\"score\"] = 0 / print(student) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 조건 분기와 반복을 따라 실제로 실행되는 경로를 확인한다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(학생)`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":7,"number":10,"title":"함수 테스트","english":"def square(n):\n    return n * n\nassert square(3) == 9\nassert square(-2) == 4\nprint(\"테스트 통과\")","code":"출력 = print\n\ndef 제곱(수):\n    return 수 * 수\nassert 제곱(3) == 9\nassert 제곱(-2) == 4\n출력(\"테스트 통과\")","desc":["학습 초점: assert로 함수의 실제 반환값과 예상값이 같은지 검사한다.","자료와 시작 상태: `def square(n):` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: assert square(-2) == 4 / print(\"테스트 통과\") 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: return은 값을 호출한 위치로 돌려주며 함수 실행을 끝낸다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(\"테스트 통과\")`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":8,"number":1,"title":"클래스와 객체","english":"class Student:\n    def __init__(self, name):\n        self.name = name\nstudent = Student(\"Mina\")\nprint(student.name)","code":"출력 = print\n\nclass 학생:\n    def __init__(self, 이름):\n        self.name = 이름\n학생 = 학생(\"Mina\")\n출력(학생.name)","desc":["학습 초점: 클래스는 객체의 설계도이고 생성자는 객체가 가질 초기 속성을 설정한다.","자료와 시작 상태: `class Student:` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: student = Student(\"Mina\") / print(student.name) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(학생.name)`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":8,"number":2,"title":"메서드","english":"class Counter:\n    def __init__(self):\n        self.value = 0\n    def increase(self):\n        self.value += 1\ncounter = Counter()\ncounter.increase()\nprint(counter.value)","code":"출력 = print\n\nclass 계수기:\n    def __init__(self):\n        self.value = 0\n    def increase(self):\n        self.value += 1\n계수객체 = 계수기()\n계수객체.increase()\n출력(계수객체.value)","desc":["학습 초점: 인스턴스 메서드는 self를 통해 해당 객체의 속성을 읽거나 수정한다.","자료와 시작 상태: `class Counter:` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: "상속","english":"class Animal:\n    def speak(self):\n        return \"소리\"\nclass Dog(Animal):\n    def speak(self):\n        return \"멍멍\"\nprint(Dog().speak())","code":"출력 = print\n\nclass 동물:\n    def speak(self):\n        return \"소리\"\nclass 강아지(동물):\n    def speak(self):\n        return \"멍멍\"\n출력(강아지().speak())","desc":["학습 초점: 자식 클래스는 부모 클래스의 속성과 메서드를 물려받는다.","자료와 시작 상태: `class Animal:` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: return \"멍멍\" / print(Dog().speak()) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: return은 값을 호출한 위치로 돌려주며 함수 실행을 끝낸다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(강아지().speak())`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":8,"number":6,"title":"super 호출","english":"class Person:\n    def __init__(self, name):\n        self.name = name\nclass Student(Person):\n    def __init__(self, name, grade):\n        super().__init__(name)\n        self.grade = grade\nprint(Student(\"A\", 2).name)","code":"출력 = print\n\nclass 사람:\n    def __init__(self, 이름):\n        self.name = 이름\nclass 학생(사람):\n    def __init__(self, 이름, 학년):\n        super().__init__(이름)\n        self.grade = 학년\n출력(학생(\"A\", 2).name)","desc":["학습 초점: super는 부모 클래스의 초기화나 메서드 구현을 호출한다.","자료와 시작 상태: `class Person:` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: self.grade = grade / print(Student(\"A\", 2).name) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(학생(\"A\", 2).name)`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":8,"number":7,"title":"프로퍼티","english":"class Circle:\n    def __init__(self, radius):\n        self.radius = radius\n    @property\n    def area(self):\n        return 3.14 * self.radius ** 2\nprint(Circle(2).area)","code":"출력 = print\n\nclass 원:\n    def __init__(self, 반지름):\n        self.radius = 반지름\n    @property\n    def area(self):\n        return 3.14 * self.radius ** 2\n출력(원(2).area)","desc":["학습 초점: property는 속성 접근을 메서드로 제어하고 유효성 검사를 넣을 수 있다.","자료와 시작 상태: `class Circle:` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: return 3.14 * self.radius ** 2 / print(Circle(2).area) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: return은 값을 호출한 위치로 돌려주며 함수 실행을 끝낸다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(원(2).area)`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":8,"number":8,"title":"클래스 메서드","english":"class Student:\n    school = \"Science\"\n    @classmethod\n    def get_school(cls):\n        return cls.school\nprint(Student.get_school())","code":"출력 = print\n\nclass 학생:\n    학교 = \"Science\"\n    @classmethod\n    def get_school(cls):\n        return cls.학교\n출력(학생.get_school())","desc":["학습 초점: classmethod는 개별 객체가 아닌 클래스를 첫 인자로 받는다.","자료와 시작 상태: `class Student:` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: return cls.school / print(Student.get_school()) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: return은 값을 호출한 위치로 돌려주며 함수 실행을 끝낸다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(학생.get_school())`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":8,"number":9,"title":"정적 메서드","english":"class MathTool:\n    @staticmethod\n    def square(n):\n        return n * n\nprint(MathTool.square(5))","code":"출력 = print\n\nclass 수학도구:\n    @staticmethod\n    def 제곱(수):\n        return 수 * 수\n출력(수학도구.제곱(5))","desc":["학습 초점: staticmethod는 객체 상태에 의존하지 않는 기능을 클래스 안에 묶는다.","자료와 시작 상태: `class MathTool:` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: return n * n / print(MathTool.square(5)) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: return은 값을 호출한 위치로 돌려주며 함수 실행을 끝낸다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자  80), (\"B\", 90), (\"A\", 95)]\ngroups = defaultdict(list)\nfor name, score in records:\n    groups[name].append(score)\nprint(dict(groups))","code":"목록 = list\n출력 = print\n사전 = dict\n\nfrom collections import defaultdict\n기록들 = [(\"A\", 80), (\"B\", 90), (\"A\", 95)]\n묶음 = defaultdict(목록)\nfor 이름, 점수 in 기록들:\n    묶음[이름].append(점수)\n출력(사전(묶음))","desc":["학습 초점: defaultdict는 없는 키에 빈 목록을 자동으로 만들어 자료를 그룹화한다.","자료와 시작 상태: `records = [(\"A\", 80), (\"B\", 90), (\"A\", 95)]` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: groups[name].append(score) / print(dict(groups)) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 조건 분기와 반복을 따라 실제로 실행되는 경로를 확인한다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 원본 자료의 변경 여부와 새 객체 생성 여부를 구분한다.","한글·영문 대응: `출력(사전(묶음))`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":9,"number":9,"title":"데카르트 곱","english":"from itertools import product\nprint(list(product([0, 1], repeat=2)))","code":"출력 = print\n목록 = list\n\nfrom itertools import product\n출력(목록(product([0, 1], repeat=2)))","desc":["학습 초점: product는 여러 집합에서 하나씩 뽑는 모든 순서쌍을 생성한다.","자료와 시작 상태: `from itertools import product` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: from itertools import product / print(list(product([0, 1], repeat=2))) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(목록(product([0, 1], repeat=2)))`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":9,"number":10,"title":"분수 연산","english":"from fractions import Fraction\na = Fraction(1, 3)\nb = Fraction(1, 6)\nprint(a + b)","code":"출력 = print\n\nfrom fractions import Fraction\n가 = Fraction(1, 3)\n나 = Fraction(1, 6)\n출력(가 + 나)","desc":["학습 초점: Fraction은 분자와 분모를 유지해 유리수를 정확하게 계산한다.","자료와 시작 상태: `a = Fraction(1, 3)` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: b = Fraction(1, 6) / print(a + b) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(가 + 나)`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":10,"number":1,"title":"피보나치 DP","english":"dp = [0, 1]\nfor i in range(2, 9):\n    dp.append(dp[-1] + dp[-2])\nprint(dp)","code":"범위 = range\n출력 = print\n\n최적표 = [0, 1]\nfor 번호 in 범위(2, 9):\n    최적표.append(최적표[-1] + 최적표[-2])\n출력(최적표)","desc":["학습 초점: 앞의 두 피보나치 값을 이용해 다음 값을 저장하므로 같은 부분문제를 반복 계산하지 않는다.","자료와 시작 상태: `dp = [0, 1]` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: dp.append(dp[-1] + dp[-2]) / print(dp) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 조건 분기와 반복을 따라 실제로 실행되는 경로를 확인한다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 원본 자료의 변경 여부와 새 객체 생성 여부를 구분한다.","한글·영문 대응: `출력(최적표)`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":10,"number":2,"title":"동전 최소 개수","english":"coins = [1, 3, 4]\ntarget = 6\ndp = [0] + [float(\"inf\")] * target\nfor amount in range(1, target + 1):\n    dp[amount] = min((dp[amount - c] + 1 for c in coins if c <= amount), default=float(\"inf\"))\nprint(dp[target])","code":"실수 = float\n범위 = range\n최솟값 = min\n출력 = print\n\n동전들 = [1, 3, 4]\n목표 = 6\n최적표 = [0] + [실수(\"inf\")] * 목표\nfor 금액 in 범위(1, 목표 + 1):\n    최적표[금액] = 최솟값((최적표[금액 - 동전] + 1 for 동전 in 동전들 if 동전 <= 금액), default=실수(\"inf\"))\n출력(최적표[목표])","desc":["학습 초점: 금액별 최소 동전 수를 작은 금액부터 계산해 DP 표를 채운다.","자료와 시작 상태: `coins = [1, 3, 4]` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: dp[amount] = min((dp[amount - c] + 1 for c in coins if c <= amount), default=float(\"inf\")) / print(dp[target]) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 조건 분기와 반복을 따라 실제로 실행되는 경로를 확인한다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(최적표[목표])`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":10,"number":3,"title":"그리디 거스름돈","english":"coins = [500, 100, 50, 10]\namount = 760\ncount = 0\nfor coin in coins:\n    count += amount // coin\n    amount %= coin\nprint(count)","code":"출력 = print\n\n동전들 = [500, 100, 50, 10]\n금액 = 760\n개수 = 0\nfor coin in 동전들:\n    개수 += 금액 // coin\n    금액 %= coin\n출력(개수)","desc":["학습 초점: 큰 동전부터 가능한 만큼 선택하는 그리디 전략으로 거스름돈을 만든다.","자료와 시작 상태: `coins = [500, 100, 50, 10]` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: amount %= coin / print(count) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 조건 분기와 반복을 따라 실제로 실행되는 경로를 확인한다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(개수)`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":10,"number":4,"title":"최단 경로 BFS","english":"from collections import deque\ngraph = {0: [1, 2], 1: [3], 2: [3], 3: []}\nqueue = deque([(0, [0])])\nvisited = {0}\nwhile queue:\n    node, path = queue.popleft()\n    if node == 3:\n        print(path)\n        break\n    for nxt in graph[node]:\n        if nxt not in visited:\n            visited.add(nxt)\n            queue.append((nxt, path + [nxt]))","code":"출력 = print\n\nfrom collections import deque\n그래프 = {0: [1, 2], 1: [3], 2: [3], 3: []}\n큐 = deque([(0, [0])])\n방문 = {0}\nwhile 큐:\n    정점, 경로 = 큐.popleft()\n    if 정점 == 3:\n        출력(경로)\n        break\n    for 다음정점 in 그래프[정점]:\n        if 다음정점 not in 방문:\n            방문.add(다음정점)\n            큐.append((다음정점, 경로 + [다음정점]))","desc":["학습 초점: 가중치가 동일한 그래프에서 BFS로 시작점에서 목표점까지 최단 간선 수를 찾는다.","자료와 시작 상태: `graph = {0: [1, 2], 1: [3], 2: [3], 3: []}` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: visited.add(nxt) / queue.append((nxt, path + [nxt])) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 조건 분기와 반복을 따라 실제로 실행되는 경로를 확인한다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 원본 자료의 변경 여부와 새 객체 생성 여부를 구분한다.","한글·영문 대응: `큐.append((다음정점, 경로 + [다음정점]))`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":10,"number":5,"title":"성적 등급 분류","english":"scores = {\"A\": 95, \"B\": 82, \"C\": 67}\ngrades = {name: (\"A\" if score >= 90 else \"B\" if score >= 80 else \"C\") for name, score in scores.items()}\nprint(grades)","code":"출력 = print\n\n점수표 = {\"A\": 95, \"B\": 82, \"C\": 67}\n등급표 = {이름: (\"A\" if 점수 >= 90 else \"B\" if 점수 >= 80 else \"C\") for 이름, 점수 in 점수표.items()}\n출력(등급표)","desc":["학습 초점: 점수에 따라 조건을 차례로 검사하여 알맞은 등급을 부여한다.","자료와 시작 상태: `scores = {\"A\": 95, \"B\": 82, \"C\": 67}` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: grades = {name: (\"A\" if score >= 90 else \"B\" if score >= 80 else \"C\") for name, score in scores.items()} / print(grades) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 조건 분기와 반복을 따라 실제로 실행되는 경로를 확인한다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(등급표)`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":10,"number":6,"title":"이동 평균","english":"numbers = [10, 20, 30, 40, 50]\nwindow = 3\nmeans = [sum(numbers[i:i+window]) / window for i in range(len(numbers)-window+1)]\nprint(means)","code":"합 = sum\n범위 = range\n길이 = len\n출력 = print\n\n숫자들 = [10, 20, 30, 40, 50]\n구간크기 = 3\n평균들 = [합(숫자들[번호:번호+구간크기]) / 구간크기 for 번호 in 범위(길이(숫자들)-구간크기+1)]\n출력(평균들)","desc":["학습 초점: 연속된 일정 구간의 평균을 계산하여 수치 변화의 흐름을 살펴본다.","자료와 시작 상태: `numbers = [10, 20, 30, 40, 50]` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: means = [sum(numbers[i:i+window]) / window for i in range(len(numbers)-window+1)] / print(means) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 조건 분기와 반복을 따라 실제로 실행되는 경로를 확인한다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(평균들)`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":10,"number":7,"title":"문자 빈도 분석","english":"from collections import Counter\ntext = \"data science\"\ncounts = Counter(c for c in text if c != \" \")\nprint(counts.most_common(3))","code":"출력 = print\n\nfrom collections import Counter\n글 = \"data science\"\n빈도표 = Counter(동전 for 동전 in 글 if 동전 != \" \")\n출력(빈도표.most_common(3))","desc":["학습 초점: 문자마다 출현 횟수를 세어 가장 자주 나타나는 문자를 분석한다.","자료와 시작 상태: `text = \"data science\"` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: counts = Counter(c for c in text if c != \" \") / print(counts.most_common(3)) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 조건 분기와 반복을 따라 실제로 실행되는 경로를 확인한다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(빈도표.most_common(3))`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":10,"number":8,"title":"좌표 거리 계산","english":"import math\na = (1, 2)\nb = (4, 6)\ndistance = math.dist(a, b)\nprint(distance)","code":"출력 = print\n\nimport math\n가 = (1, 2)\n나 = (4, 6)\n거리 = math.dist(가, 나)\n출력(거리)","desc":["학습 초점: 두 점의 x좌표 차와 y좌표 차에 피타고라스 정리를 적용해 거리를 구한다.","자료와 시작 상태: `a = (1, 2)` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: distance = math.dist(a, b) / print(distance) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 변수에 저장된 값이 다음 연산으로 어떻게 전달되는지 살펴본다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(거리)`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":10,"number":9,"title":"완전 탐색 최적합","english":"numbers = [2, 4, 5, 7]\ntarget = 9\nsolutions = []\nfor mask in range(1 << len(numbers)):\n    chosen = [n for i, n in enumerate(numbers) if mask & (1 << i)]\n    if sum(chosen) == target:\n        solutions.append(chosen)\nprint(solutions)","code":"범위 = range\n길이 = len\n번호붙이기 = enumerate\n합 = sum\n출력 = print\n\n숫자들 = [2, 4, 5, 7]\n목표 = 9\n해목록 = []\nfor 비트마스크 in 범위(1 << 길이(숫자들)):\n    선택목록 = [수 for 번호, 수 in 번호붙이기(숫자들) if 비트마스크 & (1 << 번호)]\n    if 합(선택목록) == 목표:\n        해목록.append(선택목록)\n출력(해목록)","desc":["학습 초점: 가능한 후보를 모두 검사하고 목표에 가장 가까운 합을 선택한다.","자료와 시작 상태: `numbers = [2, 4, 5, 7]` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: solutions.append(chosen) / print(solutions) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 조건 분기와 반복을 따라 실제로 실행되는 경로를 확인한다.","핵심 표현: 출력 함수는 계산된 값이나 자료구조의 표현을 화면에 표시한다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 원본 자료의 변경 여부와 새 객체 생성 여부를 구분한다.","한글·영문 대응: `출력(해목록)`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]},{"step":10,"number":10,"title":"프로젝트 함수 분리","english":"def summarize(scores):\n    if not scores:\n        return {\"count\": 0, \"average\": None}\n    return {\"count\": len(scores), \"average\": sum(scores) / len(scores)}\nprint(summarize([85, 90, 95]))","code":"길이 = len\n합 = sum\n출력 = print\n\ndef 요약(점수표):\n    if not 점수표:\n        return {\"count\": 0, \"average\": None}\n    return {\"count\": 길이(점수표), \"average\": 합(점수표) / 길이(점수표)}\n출력(요약([85, 90, 95]))","desc":["학습 초점: 입력·처리·출력 기능을 함수로 분리하여 수정과 재사용을 쉽게 한다.","자료와 시작 상태: `def summarize(scores):` 문장을 중심으로 입력값과 초기 자료를 확인한다.","연산 해석: return {\"count\": len(scores), \"average\": sum(scores) / len(scores)} / print(summarize([85, 90, 95])) 부분이 실제 계산 또는 자료 처리의 중심이다.","코드 구조: 조건 분기와 반복을 따라 실제로 실행되는 경로를 확인한다.","핵심 표현: return은 값을 호출한 위치로 돌려주며 함수 실행을 끝낸다.","결과 확인: '(코드를 실행하여 확인)'","주의할 점: 경계값과 자료형이 달라질 때 같은 코드가 어떻게 동작하는지 확인한다.","한글·영문 대응: `출력(요약([85, 90, 95]))`와 영문 코드의 마지막 실행문을 비교한다.","확장 실습: 예제의 입력 자료 한 가지를 바꾼 뒤 출력이 어떻게 달라질지 예상하고 검증한다."]}];
const root=document.getElementById('root'),toc=document.getElementById('toc'),search=document.getElementById('search'),count=document.getElementById('count');
function node(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e;}
STEPS.forEach((s,i)=>{const li=node('li'),a=node('a','',String(i+1).padStart(2,'0')+'단계 · '+s.title+' (10예제)');a.href='#step'+(i+1);li.append(a);toc.append(li)});
async function copyCode(code,b){try{if(navigator.clipboard && window.isSecureContext){await navigator.clipboard.writeText(code)}else{const t=document.createElement('textarea');t.value=code;t.style.position='fixed';t.style.left='-9999px';document.body.append(t);t.select();if(!document.execCommand('copy'))throw Error('failed');t.remove()}b.textContent='복사 완료';setTimeout(()=>b.textContent='코드 복사',1300)}catch(e){b.textContent='복사 실패';setTimeout(()=>b.textContent='코드 복사',1300)}}
function render(){const q=search.value.trim().toLowerCase();root.replaceChildren();let total=0;STEPS.forEach((s,i)=>{const items=DATA.filter(x=>x.step===i+1&&(s.title+' '+x.title+' '+x.code+' '+x.english+' '+x.desc.join(' ')).toLowerCase().includes(q));if(!items.length)return;const section=node('section','lesson');section.id='step'+(i+1);section.append(node('h2','',(i+1)+'단계. '+s.title),node('p','hint','핵심 개념: '+s.concept));items.forEach(x=>{const art=node('article','example'),head=node('div','headrow');head.append(node('h3','',x.step+'-'+String(x.number).padStart(2,'0')+'. '+x.title));head.append(node('span','hint','한글 코드 ↔ 영문 코드'));art.append(head);const panels=node('div','code-pair');[['한글 파이썬 코드',x.code],['영문 파이썬 코드',x.english]].forEach(([label,code])=>{const panel=node('div','code-panel'),bar=node('div','code-bar');bar.append(node('strong','',label));const b=node('button','','코드 복사');b.addEventListener('click',()=>copyCode(code,b));bar.append(b);panel.append(bar,node('pre','',code));panels.append(panel)});art.append(panels,node('h4','','개념·코드 해설 (9개 항목)'));const ol=node('ol','desc');x.desc.forEach(t=>ol.append(node('li','',t)));art.append(ol);section.append(art)});root.append(section);total+=items.length});count.textContent='표시 '+total+' / 100개';if(!total)root.append(node('p','','검색 결과가 없습니다.'))}search.addEventListener('input',render);render();</script></body></html>
